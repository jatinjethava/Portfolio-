version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mern-portfolio-server
    ports:
      - "8100:8100"
    environment:
      - NODE_ENV=production
      - PORT=8100
      - MONGODB_URI=mongodb://mongo:27017/portfolio
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=mern_production_super_secret_jwt_key_2026
      - CORS_ORIGIN=http://localhost:8100
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mern-network

  mongo:
    image: mongo:7.0
    container_name: mern-portfolio-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=portfolio
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mern-network

  redis:
    image: redis:7.2-alpine
    container_name: mern-portfolio-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
